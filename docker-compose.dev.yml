services:
  app:
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:11.8.6@sha256:78a5047d3ba33975f183f183c2464cc7f1eab13ec8667e57cc9a5821d6da7577
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-rezeptdatenbank}
      MARIADB_USER: ${MARIADB_USER:-rezeptdatenbank}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Entwicklungs-DB-Passwort erforderlich}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Entwicklungs-Root-Passwort erforderlich}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  mariadb_data:
