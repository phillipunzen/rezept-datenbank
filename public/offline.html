<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Offline-Küche · rezeptdatenbank</title>
    <link rel="stylesheet" href="/offline.css" />
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <a href="/">← rezeptdatenbank.</a
        ><button id="language" type="button">English</button>
      </header>
      <h1 id="title">Offline-Küche</h1>
      <p id="intro">
        Rezepte, Wochenplan und Einkaufslisten verschlüsselt auf diesem Gerät
        speichern. Eine eigene Offline-Passphrase schützt die Daten.
      </p>
      <p id="availability" role="status"></p>
      <p id="feedback" role="status"></p>
      <section id="gate">
        <label id="pass-label" for="passphrase"
          >Offline-Passphrase (mindestens 12 Zeichen)</label
        ><input
          id="passphrase"
          type="password"
          autocomplete="off"
          minlength="12"
          required
        />
        <div class="actions">
          <button id="unlock" type="button">Entsperren / neu anlegen</button
          ><button id="erase" type="button">Lokale Daten löschen</button>
        </div>
      </section>
      <section id="vault" hidden>
        <div class="actions">
          <button id="refresh" type="button">Online-Daten auswählen</button
          ><button id="sync" type="button">Änderungen synchronisieren</button
          ><button id="lock" type="button">Sperren</button>
        </div>
        <p id="snapshot-info"></p>
        <section id="selection" hidden>
          <label id="household-label" for="household">Haushalt</label
          ><select id="household"></select>
          <form id="recipe-search">
            <label id="search-label" for="query">Rezepte suchen</label
            ><input id="query" type="search" maxlength="200" /><button
              id="search"
              type="submit"
            >
              Suchen
            </button>
          </form>
          <p id="selection-count"></p>
          <div id="choices"></div>
          <div class="actions">
            <button id="previous-page" type="button">Vorherige Seite</button
            ><button id="next-page" type="button">Nächste Seite</button>
          </div>
          <button id="download" type="button">Auswahl offline speichern</button>
        </section>
        <section id="conflicts"></section>
        <h2 id="recipes-title">Rezepte</h2>
        <div id="recipes"></div>
        <section id="detail" hidden></section>
        <h2 id="plan-title">Diese Woche</h2>
        <div id="plan"></div>
        <h2 id="shopping-title">Einkaufslisten</h2>
        <div id="shopping"></div>
      </section>
    </main>
  </body>
</html>
