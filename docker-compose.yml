# Rezeptbuch – nutzt eine externe MariaDB (es läuft keine Datenbank im Container).
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/phillipunzen/rezept-datenbank:latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    # Falls die MariaDB auf dem Docker-Host läuft, ist sie unter host.docker.internal erreichbar:
    extra_hosts:
      - "host.docker.internal:host-gateway"
