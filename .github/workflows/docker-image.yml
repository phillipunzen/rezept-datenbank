name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package*.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'prisma/**'
      - 'public/**'
      - 'scripts/**'
      - 'server/**'
      - 'shared/**'
      - 'src/**'
  pull_request:
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package*.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'prisma/**'
      - 'public/**'
      - 'scripts/**'
      - 'server/**'
      - 'shared/**'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: Build image for runtime check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rezeptdatenbank:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image against an external MariaDB
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            if [ "$?" -ne 0 ]; then
              docker logs image-app || true
            fi
            docker rm -f image-app image-mariadb >/dev/null 2>&1 || true
            docker network rm image-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create image-test >/dev/null
          # This DB is a disposable CI fixture, outside the application image.
          docker run -d --name image-mariadb --network image-test \
            -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 \
            -e MARIADB_DATABASE=image_test -e MARIADB_USER=rezeptdatenbank \
            -e MARIADB_PASSWORD=image-test-password \
            --health-cmd='healthcheck.sh --connect --innodb_initialized' \
            --health-interval=2s --health-timeout=5s --health-retries=30 \
            mariadb:11.8.6@sha256:78a5047d3ba33975f183f183c2464cc7f1eab13ec8667e57cc9a5821d6da7577 >/dev/null
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' image-mariadb)" = healthy ]; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' image-mariadb)" = healthy
          docker run -d --name image-app --network image-test \
            -p 127.0.0.1:8080:3000 \
            -e DATABASE_URL=mysql://rezeptdatenbank:image-test-password@image-mariadb:3306/image_test \
            -e APP_ORIGIN=http://localhost:8080 \
            -e INITIAL_SETUP_TOKEN=image-smoke-setup-token-at-least-32-characters \
            -e COOKIE_SECURE=false -e COOKIDOO_ENABLED=false \
            -e OIDC_ISSUER=https://provider.test/application/o/rezeptdatenbank/ \
            -e OIDC_CLIENT_ID=image-test-client -e OIDC_CLIENT_SECRET=image-test-secret \
            -e 'OIDC_LABEL=Mit Authentik anmelden' -e OIDC_REGISTRATION_ENABLED=false \
            rezeptdatenbank:ci >/dev/null
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          # Provider discovery runs at sign-in; these checks need no external IdP.
          docker exec image-app node -e "fetch('http://127.0.0.1:3000/api/v1/auth/options').then(async r=>{if(!r.ok)process.exit(1);const o=await r.json();if(o.oidcEnabled!==true||o.oidcLabel!=='Mit Authentik anmelden')process.exit(1)}).catch(()=>process.exit(1))"
          docker exec image-app sh -c '! command -v mariadbd && ! command -v mysqld'
          # Device-code runtime is bundled; this command does not sign in or run inference.
          docker exec image-app node node_modules/@openai/codex/bin/codex.js --version
          test "$(docker compose --env-file .env.example config --services)" = app
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Image summary
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo '### Published image' >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
