name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: Build image for runtime check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rezeptbuch:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image against an external MariaDB
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            if [ "$?" -ne 0 ]; then docker logs image-app || true; fi
            docker rm -f image-app image-mariadb >/dev/null 2>&1 || true
            docker network rm image-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create image-test >/dev/null
          # Die Datenbank ist nur eine Test-Fixture außerhalb des App-Images.
          docker run -d --name image-mariadb --network image-test \
            -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 \
            -e MARIADB_DATABASE=rezeptbuch -e MARIADB_USER=rezeptbuch -e MARIADB_PASSWORD=ci-password \
            --health-cmd='healthcheck.sh --connect --innodb_initialized' \
            --health-interval=2s --health-timeout=5s --health-retries=30 \
            mariadb:11.8.6@sha256:78a5047d3ba33975f183f183c2464cc7f1eab13ec8667e57cc9a5821d6da7577 >/dev/null
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' image-mariadb)" = healthy ]; then break; fi
            sleep 2
          done
          docker run -d --name image-app --network image-test -p 127.0.0.1:8080:3000 \
            -e APP_URL=http://localhost:8080 -e APP_SECRET=ci-secret-0123456789abcdef0123456789 \
            -e DB_HOST=image-mariadb -e DB_USER=rezeptbuch -e DB_PASSWORD=ci-password -e DB_NAME=rezeptbuch \
            -e ADMIN_EMAIL=ci@example.org -e ADMIN_PASSWORD=ci-password-123 \
            rezeptbuch:ci >/dev/null
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/sw.js >/dev/null
          curl -fsS -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/api/auth/login \
            -d '{"login":"ci@example.org","password":"ci-password-123"}' | grep -q '"role":"admin"'
          docker exec image-app sh -c '! command -v mariadbd && ! command -v mysqld'
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Image summary
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "### Published image: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
